name: Android APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      # ubuntu-latest ships the Android SDK (ANDROID_HOME); Gradle fetches any missing platform.
      - run: npm ci
      - run: npm test
      - run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v5
        with:
          name: loopsy-doopsy-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      # Each push to the default branch becomes a GitHub Release with the APK attached;
      # Obtainium on the phone watches these releases and offers the update.
      - name: Publish release
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v1.0.${GITHUB_RUN_NUMBER}"
          cp android/app/build/outputs/apk/debug/app-debug.apk "loopsy-doopsy-${tag}.apk"
          gh release create "$tag" "loopsy-doopsy-${tag}.apk" --target "$GITHUB_SHA" \
            --title "Loopsy Doopsy ${tag}" --notes "$(git log -1 --pretty=%s)"
