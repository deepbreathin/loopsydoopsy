name: Web app (GitHub Pages)

# Publishes www/ as the installable web app (PWA) for iPhone, Android and computers.
# It's plain static files: no server, no database, nothing that costs money. Everyone's
# sounds stay on their own device; they swap them as files.
#
# One-time setup: repo Settings → Pages → Build and deployment → Source: "GitHub Actions".

on:
  # Only main goes live. (Pushes to other branches mustn't start a run: they'd cancel a
  # deploy of main that's still going, through the concurrency group below.)
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm test
      - name: Stamp the version
        run: sed -i "s/__BUILD__/$(date -u +%Y-%m-%d)-${GITHUB_SHA::7}/" www/js/version.js www/sw.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: www
      - id: deployment
        uses: actions/deploy-pages@v4
