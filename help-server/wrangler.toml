name = "loopsydoopsy-help"
main = "src/index.js"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

# Counters (daily limits) and the suggestions people send.
# Create it once with:  npx wrangler kv namespace create HELP_KV   and paste the id here.
[[kv_namespaces]]
binding = "HELP_KV"
id = "REPLACE_WITH_YOUR_KV_ID"

[vars]
# The web address the app is served from (only it may call this server).
ALLOWED_ORIGIN = "https://deepbreathin.github.io"
# Most AI answers per day, for everyone together, and per person (by IP address).
DAILY_LIMIT = "200"
PER_PERSON_DAILY_LIMIT = "15"
# Which Claude model answers. claude-haiku-5-5 is roughly 40x cheaper if you'd rather.
MODEL = "claude-opus-5-5"

# Secrets (never put these in this file):
#   npx wrangler secret put ANTHROPIC_API_KEY   (from platform.claude.com → API keys)
#   npx wrangler secret put ADMIN_KEY           (any long password; lets you read suggestions)
